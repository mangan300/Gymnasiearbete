<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plåtbearbetning</title>
<!--
  Namn: Magnus Bergkvist
  Klass: Te14

  Webbversion av plåtprogrammet.
  Man anger bredd, tjocklek och längd på en plåt (mm) och formar sedan om
  plåten med reglage. Volymen är alltid densamma före och efter: det mått
  som är valt som "beräknas" räknas ut så att volymen bevaras.
  Plåten får som mest vara 15 m lång och 3 m bred.

  Sida 2 (Skärning) visar hur plåten från sida 1 skärs ut ur tre
  standardplåtar och hur många bitar som ryms i varje.
-->
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d2129;
    --muted: #646b78;
    --border: #d9dce2;
    --accent: #2f6fd0;
    --ok: #2e8b57;
    --warn: #c0392b;
    --fore-top: #b7c0cc; --fore-front: #8e99a8; --fore-side: #6f7a8a;
    --efter-top: #7cc0ea; --efter-front: #3f93c9; --efter-side: #2f75a6;
    --edge: #2a2f38;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e2228; --panel: #2c313a; --text: #e6e9ee; --muted: #9aa0aa;
      --border: #414854; --accent: #6b9ef0; --ok: #5cc28a; --warn: #ee7b6e;
      --fore-top: #aab4c3; --fore-front: #7c8798; --fore-side: #5f6979;
      --efter-top: #78bfe8; --efter-front: #4690c2; --efter-side: #33739f;
      --edge: #14171c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e2228; --panel: #2c313a; --text: #e6e9ee; --muted: #9aa0aa;
    --border: #414854; --accent: #6b9ef0; --ok: #5cc28a; --warn: #ee7b6e;
    --fore-top: #aab4c3; --fore-front: #7c8798; --fore-side: #5f6979;
    --efter-top: #78bfe8; --efter-front: #4690c2; --efter-side: #33739f;
    --edge: #14171c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    display: grid; grid-template-columns: 320px 1fr; gap: 16px;
    max-width: 1300px; margin: 0 auto; padding: 16px;
  }
  .kort {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1rem; margin: 20px 0 10px; color: var(--muted); font-weight: 600; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .falt { margin-bottom: 12px; }
  input[type=number], select {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  input[type=number]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .reglage { margin-bottom: 16px; }
  .reglage .rad { display: flex; justify-content: space-between; font-size: .9rem; }
  .reglage .rad b { font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .beraknad { opacity: .6; }
  .beraknad input[type=range] { pointer-events: none; }
  .knappar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button {
    flex: 1; padding: 9px 12px; font: inherit; cursor: pointer;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
  }
  button:hover { border-color: var(--accent); }
  .fel { color: var(--warn); font-size: .9rem; min-height: 1.2em; margin: 8px 0 0; }

  .ritning svg { width: 100%; height: auto; display: block; }
  .ritning text { fill: var(--text); font-size: 14px; }
  .ritning .rubrik { fill: var(--muted); font-size: 16px; font-weight: 600; }
  .ritning .not { fill: var(--muted); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: .9rem; }
  .volym { margin-top: 12px; font-size: .95rem; }
  .volym .ok { color: var(--ok); font-weight: 600; }

  nav {
    display: flex; gap: 8px; max-width: 1300px; margin: 0 auto; padding: 16px 16px 0;
  }
  nav a {
    padding: 8px 16px; border-radius: 6px; text-decoration: none;
    color: var(--muted); border: 1px solid var(--border); background: var(--panel);
  }
  nav a.aktiv { color: var(--text); border-color: var(--accent); font-weight: 600; }
  [hidden] { display: none !important; }

  .ravaror { display: grid; gap: 16px; }
  .ravara h3 { margin: 0; font-size: 1.05rem; }
  .ravara .huvud { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .antal { font-size: 1.1rem; font-weight: 700; }
  .antal.noll { color: var(--warn); }
  .antal.flera { color: var(--ok); }
  .ravara svg { width: 100%; height: auto; display: block; margin-top: 10px; }
  .ravara .info { color: var(--muted); font-size: .9rem; margin-top: 6px; }
  .stort { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .forklaring { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 12px; }
  .forklaring span::before {
    content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px;
    vertical-align: -1px; border: 1px solid var(--edge); border-radius: 2px;
  }
  .forklaring .bit::before { background: var(--efter-top); }
  .forklaring .spill::before { background: var(--bg); }
  a.lank { color: var(--accent); }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    th, td { padding: 6px 4px; font-size: .85rem; }
  }
</style>
</head>
<body>
<nav>
  <a href="#sida1" id="flik1">1. Forma om</a>
  <a href="#sida2" id="flik2">2. Skärning</a>
</nav>

<div class="app" id="sida1">
  <div class="kort">
    <h1>Plåt</h1>

    <h2>Startplåt</h2>
    <div class="falt"><label for="b0">Bredd (mm, max 3 000)</label><input id="b0" type="number" min="0" max="3000" step="any" value="500"></div>
    <div class="falt"><label for="t0">Tjocklek (mm)</label><input id="t0" type="number" min="0" step="any" value="10"></div>
    <div class="falt"><label for="l0">Längd (mm, max 15 000)</label><input id="l0" type="number" min="0" max="15000" step="any" value="1000"></div>

    <h2>Forma om plåten</h2>
    <div class="falt">
      <label for="auto">Mått som beräknas (håller volymen konstant)</label>
      <select id="auto">
        <option value="t">Tjocklek</option>
        <option value="b">Bredd</option>
        <option value="l">Längd</option>
      </select>
    </div>

    <div class="reglage" id="r-b">
      <div class="rad"><span>Bredd</span><b id="v-b"></b></div>
      <input id="s-b" type="range" min="-2000" max="2000" value="0" aria-label="Bredd">
    </div>
    <div class="reglage" id="r-t">
      <div class="rad"><span>Tjocklek</span><b id="v-t"></b></div>
      <input id="s-t" type="range" min="-2000" max="2000" value="0" aria-label="Tjocklek">
    </div>
    <div class="reglage" id="r-l">
      <div class="rad"><span>Längd</span><b id="v-l"></b></div>
      <input id="s-l" type="range" min="-2000" max="2000" value="0" aria-label="Längd">
    </div>

    <div class="knappar">
      <button id="aterstall">Återställ</button>
      <button id="anvand">Använd resultat</button>
    </div>
    <p class="fel" id="fel"></p>
  </div>

  <div class="kort">
    <div class="ritning"><svg id="svg" viewBox="0 0 900 420" role="img" aria-label="Plåten före och efter"></svg></div>
    <table>
      <thead><tr><th></th><th>Bredd</th><th>Tjocklek</th><th>Längd</th></tr></thead>
      <tbody id="tabell"></tbody>
    </table>
    <div class="volym" id="volym"></div>
  </div>
</div>

<div class="app" id="sida2" hidden>
  <div class="kort">
    <h1>Skärning</h1>
    <p class="info" style="margin-top:0;color:var(--muted)">Plåten från sida 1 (efter omformning) skärs ut ur standardplåtarna. Bitarna får vridas 90°.</p>
    <h2>Bit som ska skäras ut</h2>
    <div class="stort" id="bitMatt"></div>
    <div style="color:var(--muted);font-size:.9rem" id="bitTjocklek"></div>
    <p style="font-size:.9rem;margin-top:20px">Ändra måtten på <a class="lank" href="#sida1">sida 1</a>.</p>
    <div class="forklaring"><span class="bit">Utskuren bit</span><span class="spill">Spill</span></div>
  </div>
  <div class="ravaror" id="ravaror"></div>
</div>

<script>
  // Reglagen går från -2000 till 2000. Värdet v ger faktorn 2^(v/1000),
  // alltså från en fjärdedel (x0,25) till fyra gånger (x4) originalmåttet.
  const MATT = ["b", "t", "l"];
  const NAMN = { b: "Bredd", t: "Tjocklek", l: "Längd" };
  // Största tillåtna mått i mm (tjockleken har ingen gräns)
  const MAX = { b: 3000, t: Infinity, l: 15000 };
  const $ = id => document.getElementById(id);

  function faktor(sliderVarde) { return Math.pow(2, sliderVarde / 1000); }
  function sliderVarde(f) { return Math.max(-2000, Math.min(2000, Math.round(1000 * Math.log2(f)))); }

  function startPlat() {
    const p = {};
    for (const m of MATT) {
      const v = parseFloat($(m + "0").value.replace(",", "."));
      if (!(v > 0) || v > MAX[m]) return null;
      p[m] = v;
    }
    return p;
  }

  // Ser till att reglaget för måttet m inte ger en plåt som är större än
  // maxmåtten, varken för m självt eller för det mått som beräknas.
  // Returnerar false om det inte går med de andra reglagen som de står.
  function begransa(fore, m) {
    const auto = $("auto").value;
    const ovrig = MATT.find(x => x !== m && x !== auto);
    const fOvrig = faktor(+$("s-" + ovrig).value);
    // Måttet m självt: fore[m] * f <= MAX[m]
    const hogst = Math.min(2000, Math.floor(1000 * Math.log2(MAX[m] / fore[m])));
    // Det beräknade måttet: fore[auto] / (f * fOvrig) <= MAX[auto]
    const minst = Math.max(-2000, Math.ceil(1000 * Math.log2(fore[auto] / (MAX[auto] * fOvrig))));
    if (minst > hogst) return false;
    const s = $("s-" + m);
    s.value = Math.max(minst, Math.min(hogst, +s.value));
    return true;
  }

  function begransaAlla(fore, forst) {
    const manuella = MATT.filter(m => m !== $("auto").value);
    if (forst) manuella.sort((a, b) => (b === forst) - (a === forst));
    // Kör två varv eftersom reglagen påverkar varandras gränser
    for (let varv = 0; varv < 2; varv++) {
      for (const m of manuella) {
        if (!begransa(fore, m)) {
          for (const x of MATT) $("s-" + x).value = 0;
          return;
        }
      }
    }
  }

  // Skriver volymen (given i mm³) med en lämplig enhet
  function volymText(mm3) {
    const enheter = [[1e9, "m³"], [1e6, "dm³"], [1e3, "cm³"], [1, "mm³"]];
    const [delare, enhet] = enheter.find(([d]) => mm3 >= d) || enheter[3];
    const v = mm3 / delare;
    const d = v >= 100 ? 1 : v >= 10 ? 2 : 3;
    return v.toLocaleString("sv-SE", { maximumFractionDigits: d }) + " " + enhet;
  }

  // Räknar ut plåten efter omformning. Två mått styrs av reglagen,
  // det tredje räknas ut så att bredd * tjocklek * längd blir oförändrad.
  function beraknaEfter(fore) {
    const auto = $("auto").value;
    const efter = {};
    let produkt = 1;
    for (const m of MATT) {
      if (m === auto) continue;
      const f = faktor(+$("s-" + m).value);
      efter[m] = fore[m] * f;
      produkt *= f;
    }
    efter[auto] = fore[auto] / produkt;
    return efter;
  }

  function fmt(x) {
    const d = x >= 100 ? 0 : x >= 10 ? 1 : 2;
    return x.toLocaleString("sv-SE", { maximumFractionDigits: d });
  }

  // ---- Ritning (isometrisk vy) ----
  const COS = Math.cos(Math.PI / 6), SIN = 0.5;
  function iso(x, y, z) { return [(x - y) * COS, (x + y) * SIN - z]; }

  function blockSvg(p, skala, tSkala, mitt, farger, rubrik) {
    const L = p.l * skala, B = p.b * skala, T = Math.max(p.t * tSkala, 1.5);
    const horn = [];
    for (const x of [0, L]) for (const y of [0, B]) for (const z of [0, T]) horn.push(iso(x, y, z));
    const minX = Math.min(...horn.map(h => h[0])), maxX = Math.max(...horn.map(h => h[0]));
    const minY = Math.min(...horn.map(h => h[1])), maxY = Math.max(...horn.map(h => h[1]));
    const ox = mitt[0] - (minX + maxX) / 2, oy = mitt[1] - (minY + maxY) / 2;
    const P = (x, y, z) => { const [a, b] = iso(x, y, z); return [a + ox, b + oy]; };
    const poly = (pts, farg) =>
      `<polygon points="${pts.map(q => q.join(",")).join(" ")}" fill="var(${farg})" stroke="var(--edge)" stroke-width="1" stroke-linejoin="round"/>`;

    let s = "";
    s += poly([P(0,0,T), P(L,0,T), P(L,B,T), P(0,B,T)], farger[0]);
    s += poly([P(0,B,0), P(L,B,0), P(L,B,T), P(0,B,T)], farger[1]);
    s += poly([P(L,0,0), P(L,B,0), P(L,B,T), P(L,0,T)], farger[2]);

    const [lx, ly] = P(L / 2, B, 0);
    const [bx, by] = P(L, B / 2, 0);
    const [tx, ty] = P(L, 0, T / 2);
    s += `<text x="${lx - 12}" y="${ly + 26}" text-anchor="end">L = ${fmt(p.l)} mm</text>`;
    s += `<text x="${bx + 12}" y="${by + 26}">B = ${fmt(p.b)} mm</text>`;
    s += `<text x="${tx + 10}" y="${ty + 5}">T = ${fmt(p.t)} mm</text>`;
    s += `<text class="rubrik" x="${mitt[0]}" y="32" text-anchor="middle">${rubrik}</text>`;
    return s;
  }

  function rita(fore, efter) {
    // Samma skala för båda plåtarna så att man ser skillnaden.
    const bredast = Math.max(fore.l + fore.b, efter.l + efter.b);
    const djupast = Math.max(fore.l + fore.b, efter.l + efter.b) * SIN;
    const skala = Math.min(300 / (bredast * COS), 260 / djupast);
    // Tjockleken förstoras så att den tjockaste plåten blir 50 px hög.
    const tSkala = 50 / Math.max(fore.t, efter.t);

    $("svg").innerHTML =
      blockSvg(fore, skala, tSkala, [215, 215], ["--fore-top", "--fore-front", "--fore-side"], "Före") +
      blockSvg(efter, skala, tSkala, [655, 215], ["--efter-top", "--efter-front", "--efter-side"], "Efter") +
      `<text class="not" x="450" y="410" text-anchor="middle">Bredd och längd i samma skala, tjockleken är förstorad i bilden</text>`;
  }

  // ---- Uppdatera allt ----
  function uppdatera() {
    const fore = startPlat();
    if (!fore) {
      $("fel").textContent = "Ange positiva tal. Bredden får vara högst 3 000 mm och längden högst 15 000 mm.";
      return;
    }
    $("fel").textContent = "";

    const auto = $("auto").value;
    const efter = beraknaEfter(fore);

    for (const m of MATT) {
      const ar = m === auto;
      $("r-" + m).classList.toggle("beraknad", ar);
      $("s-" + m).disabled = ar;
      const f = efter[m] / fore[m];
      if (ar) $("s-" + m).value = sliderVarde(f);
      $("v-" + m).textContent = `${fmt(efter[m])} mm (×${f.toLocaleString("sv-SE", { maximumFractionDigits: 2 })})` + (ar ? " – beräknad" : "");
    }

    rita(fore, efter);

    const rad = (namn, p) =>
      `<tr><td>${namn}</td>${MATT.map(m => `<td>${fmt(p[m])} mm</td>`).join("")}</tr>`;
    $("tabell").innerHTML = rad("Före", fore) + rad("Efter", efter);

    const vFore = fore.b * fore.t * fore.l;
    const vEfter = efter.b * efter.t * efter.l;
    const lika = Math.abs(vFore - vEfter) / vFore < 1e-9;
    $("volym").innerHTML = `Volym före: <b>${volymText(vFore)}</b> &nbsp; Volym efter: <b>${volymText(vEfter)}</b> &nbsp; ` +
      (lika ? `<span class="ok">✓ Volymen är bevarad</span>` : `<span style="color:var(--warn)">Volymen skiljer sig</span>`);
  }

  function begransaOchUppdatera(forst) {
    const fore = startPlat();
    if (fore) begransaAlla(fore, forst);
    uppdatera();
  }

  for (const m of MATT) {
    $(m + "0").addEventListener("input", () => begransaOchUppdatera());
    $("s-" + m).addEventListener("input", () => begransaOchUppdatera(m));
  }
  $("auto").addEventListener("change", () => {
    // Nollställ det nya beräknade reglaget så att de andra två gäller.
    $("s-" + $("auto").value).value = 0;
    begransaOchUppdatera();
  });
  $("aterstall").addEventListener("click", () => {
    for (const m of MATT) $("s-" + m).value = 0;
    uppdatera();
  });
  $("anvand").addEventListener("click", () => {
    const fore = startPlat();
    if (!fore) return;
    const efter = beraknaEfter(fore);
    for (const m of MATT) {
      $(m + "0").value = +efter[m].toPrecision(6);
      $("s-" + m).value = 0;
    }
    uppdatera();
  });

  // ---- Sida 2: Skärning ----
  // Standardplåtar som biten skärs ut ur (längd x bredd i mm)
  const RAVAROR = [
    { l: 10000, b: 2000 },
    { l: 8000, b: 2000 },
    { l: 4000, b: 2000 },
  ];

  // Lägger ut så många bitar (bitL x bitB) som möjligt på en plåt (L x B).
  // Bitarna kan ligga raka eller vridna 90°. Plåten delas i två fält:
  // först några rader med bitar åt ena hållet, sedan fylls resten med
  // bitar åt andra hållet. Alla uppdelningar provas och den bästa väljs.
  function packa(L, B, bitL, bitB) {
    const rutnat = (x0, y0, w, h, bl, bb) => {
      const r = [];
      for (let i = 0; i < Math.floor(w / bl + 1e-9); i++)
        for (let j = 0; j < Math.floor(h / bb + 1e-9); j++)
          r.push({ x: x0 + i * bl, y: y0 + j * bb, l: bl, b: bb });
      return r;
    };
    let bast = [];
    for (const [a, c] of [[bitL, bitB], [bitB, bitL]]) {
      // Rader längs bredden: j rader med bitar (a x c), resten vridna
      for (let j = 0; j * c <= B + 1e-9; j++) {
        const forsta = j > 0 ? rutnat(0, 0, L, j * c, a, c) : [];
        const resten = rutnat(0, j * c, L, B - j * c, c, a);
        if (forsta.length + resten.length > bast.length) bast = forsta.concat(resten);
      }
      // Kolumner längs längden: i kolumner med bitar (a x c), resten vridna
      for (let i = 0; i * a <= L + 1e-9; i++) {
        const forsta = i > 0 ? rutnat(0, 0, i * a, B, a, c) : [];
        const resten = rutnat(i * a, 0, L - i * a, B, c, a);
        if (forsta.length + resten.length > bast.length) bast = forsta.concat(resten);
      }
    }
    return bast;
  }

  function ritaRavara(r, bitar, skala) {
    const W = r.l * skala, H = r.b * skala, m = 30;
    // Bredden sätts i procent så att alla plåtar ritas i samma skala
    const andel = 100 * (W + 2 * m) / (800 + 2 * m);
    let s = `<svg style="width:${andel}%" viewBox="0 0 ${W + 2 * m} ${H + 2 * m}" role="img" aria-label="Standardplåt ${fmt(r.l)} x ${fmt(r.b)} mm">`;
    s += `<rect x="${m}" y="${m}" width="${W}" height="${H}" fill="var(--bg)" stroke="var(--edge)" stroke-width="1.5"/>`;
    bitar.forEach((p, i) => {
      const x = m + p.x * skala, y = m + p.y * skala, w = p.l * skala, h = p.b * skala;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--efter-top)" stroke="var(--edge)" stroke-width="1"/>`;
      if (w > 24 && h > 18)
        s += `<text x="${x + w / 2}" y="${y + h / 2 + 5}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--edge)">${i + 1}</text>`;
    });
    s += `<text x="${m + W / 2}" y="${m - 10}" text-anchor="middle" font-size="13" fill="var(--muted)">${fmt(r.l)} mm</text>`;
    s += `<text x="${m - 10}" y="${m + H / 2}" text-anchor="middle" font-size="13" fill="var(--muted)" transform="rotate(-90 ${m - 10} ${m + H / 2})">${fmt(r.b)} mm</text>`;
    return s + "</svg>";
  }

  function uppdateraSkarning() {
    const fore = startPlat();
    if (!fore) {
      $("bitMatt").textContent = "–";
      $("bitTjocklek").textContent = "";
      $("ravaror").innerHTML = `<div class="kort fel">Ange giltiga mått på sida 1.</div>`;
      return;
    }
    const bit = beraknaEfter(fore);
    $("bitMatt").textContent = `${fmt(bit.l)} × ${fmt(bit.b)} mm`;
    $("bitTjocklek").textContent = `Längd × bredd, tjocklek ${fmt(bit.t)} mm`;

    // Samma skala för alla standardplåtar så att storlekarna kan jämföras
    const skala = 800 / Math.max(...RAVAROR.map(r => r.l));
    $("ravaror").innerHTML = RAVAROR.map(r => {
      const bitar = packa(r.l, r.b, bit.l, bit.b);
      const n = bitar.length;
      const klass = n === 0 ? "noll" : n >= 2 ? "flera" : "";
      const text = n === 0 ? "Biten ryms inte" : n === 1 ? "1 st ryms" : `${n} st ryms`;
      const spill = 100 * (1 - n * bit.l * bit.b / (r.l * r.b));
      const info = n === 0
        ? "Biten är för stor för den här plåten, även om den vrids."
        : `Spill: ${spill.toLocaleString("sv-SE", { maximumFractionDigits: 1 })} %` +
          (n >= 2 ? ` – ${n} bitar kan skäras ut ur samma plåt.` : "");
      return `<div class="kort ravara">
        <div class="huvud"><h3>Standardplåt ${fmt(r.l)} × ${fmt(r.b)} mm</h3><span class="antal ${klass}">${text}</span></div>
        ${ritaRavara(r, bitar, skala)}
        <div class="info">${info}</div>
      </div>`;
    }).join("");
  }

  // ---- Byte mellan sidorna ----
  function visaSida() {
    const sida2 = location.hash === "#sida2";
    $("sida1").hidden = sida2;
    $("sida2").hidden = !sida2;
    $("flik1").classList.toggle("aktiv", !sida2);
    $("flik2").classList.toggle("aktiv", sida2);
    if (sida2) uppdateraSkarning();
  }
  window.addEventListener("hashchange", visaSida);

  begransaOchUppdatera();
  visaSida();
</script>
</body>
</html>
